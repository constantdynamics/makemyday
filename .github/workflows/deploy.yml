name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/app-redesign-refactor-YMwNl
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci 2>&1 | tee /tmp/install.log

      - name: Build PWA
        working-directory: ./web
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log
          echo "BUILD_OK"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/dist'

      - name: Report failure to PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return '(log not created — failed before this step)'; } };
            const tail = (s, n) => s.split('\n').slice(-n).join('\n');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '### ❌ CI build diagnostics',
              `Run: ${runUrl}`,
              '',
              '**install.log (tail):**',
              '```', tail(read('/tmp/install.log'), 20), '```',
              '**build.log (tail):**',
              '```', tail(read('/tmp/build.log'), 50), '```',
              '',
              '_If both logs look clean, the failing step is **Setup Pages** or **Upload artifact** — i.e. GitHub Pages is not enabled with “GitHub Actions” as the source in repo Settings → Pages._',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: 1, body,
            });

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
