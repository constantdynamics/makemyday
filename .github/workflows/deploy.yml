name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/app-redesign-refactor-YMwNl
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Environment info
        working-directory: ./web
        run: |
          echo "node=$(node -v) npm=$(npm -v)"

      - name: Install dependencies
        working-directory: ./web
        run: npm ci 2>&1 | tee /tmp/install.log

      - name: Build PWA
        working-directory: ./web
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Report build failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return '(no log)'; } };
            const tail = (s, n) => s.split('\n').slice(-n).join('\n');
            const body = [
              '### CI build diagnostics',
              '**install.log (tail):**',
              '```',
              tail(read('/tmp/install.log'), 30),
              '```',
              '**build.log (tail):**',
              '```',
              tail(read('/tmp/build.log'), 60),
              '```',
            ].join('\n');
            const prs = context.payload.pull_request
              ? [context.payload.pull_request.number]
              : (await github.rest.search.issuesAndPullRequests({
                  q: `repo:${context.repo.owner}/${context.repo.repo} type:pr state:open ${context.sha}`,
                })).data.items.map(i => i.number);
            for (const n of prs.length ? prs : [1]) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: n, body,
              });
            }

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
